name: Deploy to GitHub Pages

# PR 只驗證不部署（下方 Setup Pages / Upload artifact / deploy job 都有條件擋住）。
# 這樣「檢查清單」只有這一份，不會像先前 quality.yml 那樣放著各自腐爛
# —— 2026-09-06 就已經發生過：這裡加了 E2E，那份重複設定沒有。
on:
  push:
    branches: [main]
    # 只改後端（Cloud Functions，另外用 firebase deploy 部署）時不重建網站：
    # 重建會產生同版號不同雜湊的 version.json，害訪客白白跳出「新版本已就緒」（2026-11-16 f9345d6f）。
    paths-ignore:
      - 'functions/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Playwright 1.57 尚不支援 Ubuntu 26.04；固定受支援版本避免 latest 升版阻斷部署。
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts

      - name: Install Functions dependencies reproducibly
        run: npm ci --ignore-scripts --prefix functions

      - name: Block high or critical production vulnerabilities
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix functions

      - name: Cache NotoSansTC font
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: scripts/fonts/NotoSansTC-Bold.ttf
          key: ${{ runner.os }}-notosanstc-${{ hashFiles('scripts/ensure-fonts.mjs') }}

      - name: Verify required Firebase configuration exists
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=0
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            else
              echo "$name is configured"
            fi
          done
          exit "$missing"

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Public page configuration tests
        run: npm run test:public-config

      - name: Functions policy tests
        run: npm run test:functions

      - name: Security boundary tests
        run: npm run test:security

      - name: Build Functions
        run: npm run build --prefix functions

      - name: Firestore Rules tests
        run: npm run test:rules

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          # Sentry 錯誤監控（client/src/lib/sentry.ts 於頁面閒置後才動態載入）
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          GITHUB_ACTIONS: true

      # 指紋留在可信 CI 紀錄，正式驗收不必下載整包圖片／影片產物。
      - name: Record built JavaScript fingerprints
        run: sha256sum dist/public/assets/*.js

      # E2E 冒煙測試：擋住「build 過了但畫面壞掉」這一類單元測試看不到的回歸。
      # 跑在 Build 之後、上傳產物之前，測的就是即將部署的那份 dist/public。
      # （2026-09-06 加：先前 e2e/home.spec.ts 存在但沒有任何 workflow 會執行它。）
      - name: Install Playwright (chromium)
        # 下載站偶爾卡住：每次最多 5 分鐘，失敗重試一次，整步最多 12 分鐘就結束，不讓 job 卡到 60 分鐘
        # 2026-11-24：Ubuntu 套件來源偶爾很慢，第一次被 timeout 中斷時 apt-get 還在背景跑，
        # 第二次就撞「Could not get lock /var/lib/dpkg/lock-frontend」（當天連兩次部署失敗）。
        # 重試前先結束殘留的 apt、修復 dpkg；每次給 300 秒。
        timeout-minutes: 12
        run: |
          for i in 1 2; do
            if [ "$i" -gt 1 ]; then
              sudo pkill -f 'apt-get|dpkg' || true
              sleep 3
              sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
              sudo dpkg --configure -a || true
            fi
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "第 $i 次安裝 Playwright 瀏覽器失敗或逾時"
          done
          exit 1

      - name: E2E smoke tests
        run: npx playwright test --config=playwright.ci.config.ts

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # 以下只在 push 到 main 時執行；PR 跑完上面的驗證就結束
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist/public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          # Pages 檔案同步曾超過預設 10 分鐘；延長等待，保留失敗回報。
          timeout: 1200000
