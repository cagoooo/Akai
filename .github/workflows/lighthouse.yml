name: Lighthouse CI

on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-production
  cancel-in-progress: true

jobs:
  lighthouse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SITE_URL: https://cagoooo.github.io/Akai/
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test quality gate
        run: node --test scripts/lighthouse-quality.test.mjs

      - name: Verify deployed version
        run: node scripts/wait-for-deployed-version.mjs

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        id: lighthouse
        # budget.json 的效能預算維持原本觀察模式，分數閘門由下一步負責。
        continue-on-error: true
        with:
          urls: |
            https://cagoooo.github.io/Akai/
          budgetPath: ./budget.json
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Enforce quality thresholds
        if: always()
        run: node scripts/lighthouse-quality.mjs

      - name: Verify version remained unchanged during audit
        run: node scripts/wait-for-deployed-version.mjs --once

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report-${{ github.run_number }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
